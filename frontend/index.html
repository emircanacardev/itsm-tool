<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <script>
    // FOUC (yanlış temayla ilk çizim) olmasın diye tema, CSS yüklenmeden önce senkron uygulanıyor.
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse ITSM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar">
      <a class="sidebar-brand" href="#/tickets" data-i18n-title="nav.home" title="Ana sayfa">
        <div class="brand-mark-sm">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="brand-ekg" d="M3 12.2h3.4l2.2-5 3.2 9.6 2.2-4.6H21" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="brand-name-sm">PULSE</span>
      </a>

      <ul class="nav-list">
        <li id="dashboardNavItem" style="display: none;">
          <a href="#/dashboard" data-route="dashboard">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 13h4v8H3zM10 3h4v18h-4zM17 8h4v13h-4z"/>
            </svg>
            <span data-i18n="nav.dashboard">Panel</span>
          </a>
        </li>
        <li>
          <a href="#/tickets" data-route="tickets">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 2h6a1 1 0 0 1 1 1v1h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2V3a1 1 0 0 1 1-1z"/>
              <path d="M9 12h6M9 16h6M9 8h3"/>
            </svg>
            <span data-i18n="nav.tickets">Talepler</span>
          </a>
        </li>
        <li>
          <a href="#/projects" data-route="projects">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
            <span data-i18n="nav.projects">Projeler</span>
          </a>
        </li>
        <li>
          <a href="#/knowledge-base" data-route="knowledge-base">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15z"/>
            </svg>
            <span data-i18n="nav.knowledgeBase">Bilgi Bankası</span>
          </a>
        </li>
        <li>
          <a href="#/notifications" data-route="notifications">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span data-i18n="nav.notifications">Bildirimler</span>
          </a>
        </li>
        <li id="adminNavItem" style="display: none;">
          <a href="#/admin" data-route="admin">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/>
            </svg>
            <span data-i18n="nav.admin">Yönetim</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" id="sidebarAvatar">—</div>
          <div class="sidebar-user-info">
            <strong id="sidebarUserName">—</strong>
            <span id="sidebarUserEmail"></span>
          </div>
          <button class="logout-icon-btn" id="logoutButton" data-i18n-title="nav.logout" title="Çıkış yap">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <path d="M16 17l5-5-5-5M21 12H9"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar-page" id="topbarPage">
        <div>
          <h1 class="page-title" id="pageTitle"></h1>
          <p class="page-subtitle" id="pageSubtitle"></p>
        </div>
        <div class="topbar-actions">
          <div class="topbar-page-actions" id="topbarPageActions"></div>
          <button class="theme-toggle notification-bell" id="notificationBellButton" data-i18n-title="notifications.bellLabel" title="Bildirimler">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="notification-badge" id="notificationBadge" style="display: none;"></span>
          </button>
          <button class="theme-toggle" id="langToggleButton" data-i18n-title="lang.toggleLabel" title="Dili değiştir">EN</button>
          <button class="theme-toggle" id="themeToggleButton" data-theme-toggle data-i18n-title="theme.toggleLabel" title="Temayı değiştir">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="content" id="view"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script type="module" src="js/router.js"></script>
</body>
</html>
